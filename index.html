<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HomeFirst: value tree</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --side:#1D2340; --side-2:#2E3763; --side-ink:#ECEEF6; --side-mute:#A3A8C6;
  --accent:#24356B; --accent-soft:#E9EDF7; --accent-ink:#24356B;
  --sky:#EAF2FB; --sky-2:#A9D0F6;
  --g1:#F2741D; --g2:#2DB04A; --orange:#F2741D; --tot:#1D2340;
  --bg:#F6F7F9; --card:#FFFFFF; --ink:#16181D; --mute:#5F6370; --line:#DFE2E8; --line-2:#ECEEF2;
  --bad:#C8372D; --bad-soft:#FBE7E4; --good:#1C8C3C; --good-soft:#E1F4E5; --flat:#9895AE; --flat-soft:#EEEFF5;
  --amber:#B97A12; --amber-soft:#FAF0DC; --grey-card:#F4F6FB; --signal:#01C964;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --side:#12162B; --side-2:#252C52; --side-ink:#ECEEF6; --side-mute:#9DA2C2;
  --accent:#9DB2F0; --accent-soft:#232B4C; --accent-ink:#B9C8F5; --sky:#1A2236; --sky-2:#2B3B66;
  --g1:#F58A3E; --g2:#4CC56A; --orange:#F58A3E; --tot:#8E98CC;
  --bg:#0E1018; --card:#171A25; --ink:#ECEDF2; --mute:#A2A6B5; --line:#2A2E3E; --line-2:#222533;
  --bad:#F1857A; --bad-soft:#3A1E24; --good:#4FD196; --good-soft:#15342A; --flat:#8C89A6; --flat-soft:#24213F;
  --amber:#E6B04E; --amber-soft:#3A3020; --grey-card:#1D1A37; color-scheme: dark; } }
:root[data-theme="dark"]{
  --side:#12162B; --side-2:#252C52; --side-ink:#ECEEF6; --side-mute:#9DA2C2;
  --accent:#9DB2F0; --accent-soft:#232B4C; --accent-ink:#B9C8F5; --sky:#1A2236; --sky-2:#2B3B66;
  --g1:#F58A3E; --g2:#4CC56A; --orange:#F58A3E; --tot:#8E98CC;
  --bg:#0E1018; --card:#171A25; --ink:#ECEDF2; --mute:#A2A6B5; --line:#2A2E3E; --line-2:#222533;
  --bad:#F1857A; --bad-soft:#3A1E24; --good:#4FD196; --good-soft:#15342A; --flat:#8C89A6; --flat-soft:#24213F;
  --amber:#E6B04E; --amber-soft:#3A3020; --grey-card:#1D1A37; color-scheme: dark; }
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
html{ scroll-padding-top:env(safe-area-inset-top,0px); height:100%; }
*,*::before,*::after{ box-sizing:inherit; }
body{ margin:0; height:100%; background:var(--bg); color:var(--ink); font-family:"Plus Jakarta Sans", "Segoe UI", "Helvetica Neue", Arial, sans-serif; font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased; }
button{ font:inherit; color:inherit; cursor:pointer; }
button:focus-visible, select:focus-visible, input:focus-visible, [tabindex]:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
.grad{ background:linear-gradient(90deg,var(--g1),var(--g2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
.app{ display:grid; grid-template-columns:236px 1fr; min-height:100%; }
/* sidebar */
.side{ background:var(--side); color:var(--side-ink); display:flex; flex-direction:column; padding:22px 14px 18px; position:sticky; top:0; height:100vh; height:100dvh; }
.brand{ padding:2px 8px 26px; }
.brand .wm{ font-weight:800; font-size:19px; letter-spacing:.14em; }
.brand .rule{ height:3px; width:58px; border-radius:2px; background:linear-gradient(90deg,var(--g1),var(--g2)); margin:7px 0 8px; }
.brand span{ color:var(--side-mute); font-size:12.5px; display:block; }
.nav{ display:flex; flex-direction:column; gap:2px; }
.nav button{ display:flex; align-items:center; gap:13px; background:none; border:0; color:var(--side-mute); padding:10px 12px; border-radius:8px; text-align:left; font-size:14.5px; font-weight:500; }
.nav button:hover{ color:var(--side-ink); }
.nav button.on{ background:var(--side-2); color:#fff; font-weight:600; }
.nav svg{ width:19px; height:19px; flex:none; stroke:currentColor; fill:none; stroke-width:1.7; }
.badge{ margin-left:auto; background:var(--orange); color:#fff; border-radius:999px; font-size:11.5px; min-width:21px; height:21px; display:grid; place-items:center; font-weight:700; }
.side-foot{ margin-top:auto; color:var(--side-mute); font-size:12px; padding:8px; line-height:1.5; }
.side-foot b{ color:var(--side-ink); font-weight:600; display:block; margin-bottom:2px; }
.side-foot button{ background:none; border:0; color:var(--side-ink); padding:10px 0 0; font-weight:600; font-size:12.5px; text-decoration:underline; text-underline-offset:3px; }
/* top */
.main{ min-width:0; display:flex; flex-direction:column; }
.top{ background:var(--card); border-bottom:1px solid var(--line); padding:14px 28px; position:sticky; top:env(safe-area-inset-top,0px); z-index:20; display:flex; align-items:center; gap:18px; flex-wrap:wrap; }
body::before{ content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:30; background:var(--card); }
.co{ display:flex; flex-direction:column; margin-right:6px; }
.co h1{ font-size:17px; margin:0; font-weight:700; letter-spacing:-.01em; white-space:nowrap; }
.co span{ font-size:12px; color:var(--mute); }
.filters{ display:flex; gap:7px; flex-wrap:wrap; align-items:center; }
.sel{ position:relative; display:flex; align-items:center; border:1px solid var(--line); border-radius:8px; background:var(--card); padding:0 8px 0 11px; height:38px; gap:5px; }
.sel label{ color:var(--mute); font-size:13px; white-space:nowrap; }
.sel select{ appearance:none; border:0; background:transparent; font:inherit; font-size:13.5px; font-weight:600; color:var(--ink); padding:0 20px 0 2px; height:36px; cursor:pointer; max-width:150px; field-sizing:content; }
.sel::after{ content:""; position:absolute; right:11px; top:15px; width:6px; height:6px; border-right:1.6px solid var(--mute); border-bottom:1.6px solid var(--mute); transform:rotate(45deg); pointer-events:none; }
.sel select option{ color:#1C1838; }
.seg{ display:inline-flex; border:1px solid var(--line); border-radius:8px; padding:3px; align-items:center; height:38px; background:var(--grey-card); }
.seg span{ color:var(--mute); padding:0 6px 0 6px; font-size:12.5px; }
.seg button{ border:0; background:none; padding:5px 11px; border-radius:6px; font-size:13.5px; color:var(--mute); }
.seg button.on{ background:var(--card); color:var(--ink); font-weight:600; box-shadow:0 1px 2px rgba(28,24,56,.12); }
.page{ padding:26px 30px 70px; max-width:1640px; }
/* headline */
.headline{ margin:0 0 6px; font-size:25px; line-height:1.3; font-weight:700; letter-spacing:-.015em; }
.takeaway{ margin:0 0 18px; font-size:16px; color:var(--ink); }
.dek{ color:var(--mute); font-size:15px; margin:0 0 22px; max-width:900px; }
.lens-note{ margin:0 0 18px; color:var(--ink); font-size:13.5px; background:var(--sky); border-radius:8px; padding:10px 14px; max-width:1100px; }
.lens-note button{ margin-left:8px; border:1px solid var(--accent); color:var(--accent-ink); background:transparent; border-radius:6px; padding:2px 10px; font-size:12.5px; font-weight:600; }
/* stat band (annual report style: number, caption, vertical rule) */
.stats{ display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px 6px; margin-bottom:22px; }
.stat{ border-left:1.5px solid var(--line); padding:2px 16px 0; text-align:left; background:none; border-top:0; border-right:0; border-bottom:0; position:relative; min-width:0; display:flex; flex-direction:column; }
.stat:first-child{ border-left:0; }
.stat:hover .sv{ color:var(--accent-ink); }
.stat .sl{ color:var(--mute); font-size:13px; font-weight:500; }
.stat .sv{ font-size:26px; font-weight:700; letter-spacing:-.02em; margin:2px 0 0; }
.stat .sv small{ font-size:13px; color:var(--mute); font-weight:500; margin-left:3px; }
.stat .sc{ font-size:12.5px; color:var(--mute); }
.stat .sd{ font-size:12.5px; font-weight:600; }
.stat.na .sv{ color:var(--flat); font-size:14px; font-weight:500; margin-top:8px; }
.stat .sc{ margin-bottom:10px; }
.stat .spk{ margin-top:auto; padding-top:8px; width:100%; border-top:1px dashed var(--line); } .stat .spk svg{ display:block; width:100%; height:22px; }
.bad-t{ color:var(--bad); } .good-t{ color:var(--good); } .flat-t{ color:var(--mute); }
/* tabs */
.tabrow{ display:flex; align-items:flex-end; gap:20px; flex-wrap:wrap; margin-bottom:12px; justify-content:space-between; }
.tabs{ display:flex; gap:26px; border-bottom:1px solid var(--line); }
.tabs button{ border:0; background:none; padding:8px 0 10px; font-size:15px; color:var(--mute); border-bottom:2.5px solid transparent; margin-bottom:-1px; }
.tabs button.on{ color:var(--ink); font-weight:700; border-color:var(--orange); }
.legend{ display:flex; gap:14px; color:var(--mute); font-size:12.5px; flex-wrap:wrap; align-items:center; }
.legend i{ display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:5px; vertical-align:0; }
.legend .how{ border:0; background:none; color:var(--accent-ink); font-weight:600; text-decoration:underline; text-underline-offset:3px; padding:0; font-size:12.5px; }
/* tree panels */
.panels{ display:grid; gap:18px; }
.panel{ background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; position:relative; }
.panel-h{ display:flex; align-items:baseline; gap:12px; padding:16px 22px 4px; flex-wrap:wrap; }
.panel-h h2{ font-size:17px; margin:0; font-weight:700; }
.panel-h .sub{ color:var(--mute); font-size:13.5px; }
.btn{ border:1px solid var(--line); background:var(--card); border-radius:8px; padding:7px 13px; font-size:13.5px; font-weight:500; }
.btn:hover{ border-color:var(--accent); }
.btn.pri{ background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
.tree-wrap{ position:relative; overflow:auto; padding:14px 22px 70px; }
.tree-inner{ position:relative; transform-origin:0 0; }
.tree-svg{ position:absolute; inset:0; overflow:visible; pointer-events:none; }
.col-label{ position:absolute; font-size:12.5px; color:var(--mute); font-weight:600; }
.node{ position:absolute; width:196px; height:94px; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:9px 12px 8px 15px; cursor:pointer; text-align:left; overflow:hidden; }
.node::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--flat); }
.node.bad::before{ background:var(--bad); } .node.good::before{ background:var(--good); }
.node:hover{ border-color:var(--accent); box-shadow:0 2px 10px rgba(29,35,64,.10); }
.node.picked{ box-shadow:0 0 0 3px var(--orange); }
.node.ref{ border-style:dashed; background:var(--grey-card); }
.node .n{ font-size:12.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding-right:16px; }
.node .val{ font-size:21px; font-weight:700; letter-spacing:-.015em; margin-top:1px; }
.node .val small{ font-size:11.5px; color:var(--mute); font-weight:500; margin-left:3px; }
.node .ft{ display:flex; justify-content:space-between; align-items:center; font-size:11.5px; color:var(--mute); margin-top:3px; gap:4px; white-space:nowrap; }
.node .ft span:first-child{ overflow:hidden; text-overflow:ellipsis; }
.dchip{ border-radius:4px; padding:1px 6px; font-weight:600; font-size:11.5px; white-space:nowrap; }
.dchip.bad{ background:var(--bad-soft); color:var(--bad); } .dchip.good{ background:var(--good-soft); color:var(--good); } .dchip.flat{ background:var(--flat-soft); color:var(--mute); }
.node.off{ background:repeating-linear-gradient(135deg,var(--grey-card) 0 7px, var(--card) 7px 14px); cursor:default; }
.node.off::before{ background:var(--line); }
.node.off .val{ font-size:12px; color:var(--mute); font-weight:500; margin-top:8px; line-height:1.35; }
.node .ext{ position:absolute; right:8px; top:8px; width:16px; height:16px; color:var(--accent); }
.op{ position:absolute; width:20px; height:20px; border-radius:50%; background:var(--card); border:1px solid var(--line); display:grid; place-items:center; font-size:12.5px; color:var(--mute); font-weight:700; line-height:1; }
.tog{ position:absolute; height:22px; min-width:22px; padding:0 6px; border-radius:11px; background:var(--card); border:1px solid var(--line); font-size:11.5px; font-weight:700; color:var(--accent-ink); display:grid; place-items:center; }
.tog:hover{ border-color:var(--accent); }
.edge-note{ position:absolute; font-size:11.5px; color:var(--mute); }
.panel-h .fs{ margin-left:auto; }
.panel.full{ position:fixed; inset:0; z-index:45; border-radius:0; border:0; display:flex; flex-direction:column; padding-top:env(safe-area-inset-top,0px); }
.panel.full .tree-wrap{ flex:1; overflow:auto; }
.zoom{ position:absolute; right:16px; bottom:14px; display:flex; align-items:center; gap:2px; background:var(--card); border:1px solid var(--line); border-radius:9px; padding:3px; z-index:2; }
.zoom button{ border:0; background:none; padding:6px 10px; border-radius:6px; font-size:13px; }
.zoom button:hover{ background:var(--grey-card); }
.zoom span{ color:var(--mute); font-size:12.5px; min-width:42px; text-align:center; }
.zoom i{ width:1px; height:18px; background:var(--line); margin:0 3px; }
/* lower */
.lower{ display:grid; grid-template-columns:1.25fr 1fr; gap:18px; margin-top:18px; }
.box{ background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px 22px; }
.box h3{ margin:0; font-size:17px; font-weight:700; }
.box .sub{ color:var(--mute); font-size:13.5px; margin:3px 0 14px; }
.box-h{ display:flex; align-items:flex-start; gap:12px; justify-content:space-between; flex-wrap:wrap; }
.bridge-row{ display:grid; grid-template-columns:minmax(170px,250px) 1fr 64px; align-items:center; gap:12px; padding:5px 0; }
.bridge-row .lbl{ font-size:14px; display:flex; gap:6px; align-items:center; }
.bridge-row .lbl button{ border:0; background:none; padding:0; width:18px; color:var(--accent-ink); font-weight:700; }
.bridge-row.tot .lbl{ font-weight:700; }
.bar-track{ position:relative; height:18px; }
.bar{ position:absolute; top:0; height:18px; border-radius:3px; }
.bar.tot{ background:var(--tot); } .bar.neg{ background:var(--bad); } .bar.pos{ background:var(--good); }
.bridge-row .num{ text-align:right; font-weight:700; font-variant-numeric:tabular-nums; }
.sub-rows{ padding:2px 0 8px 26px; border-left:2px solid var(--line-2); margin-left:8px; }
.sub-rows div{ display:flex; justify-content:space-between; font-size:13px; color:var(--mute); padding:2px 0; }
.check{ border-top:1px solid var(--line); margin-top:12px; padding-top:12px; color:var(--mute); font-size:13px; }
.plain{ font-size:14.5px; margin:0 0 14px; }
.alert-li{ display:grid; grid-template-columns:12px 1fr auto; gap:10px; padding:12px 0; border-bottom:1px solid var(--line-2); cursor:pointer; }
.alert-li:last-child{ border-bottom:0; }
.dot{ width:9px; height:9px; border-radius:50%; margin-top:7px; background:var(--bad); }
.dot.amber{ background:var(--amber); } .dot.grey{ background:var(--flat); }
.alert-li .tt{ font-weight:600; font-size:14px; }
.tags{ display:flex; gap:8px; margin-top:5px; flex-wrap:wrap; align-items:center; font-size:12.5px; color:var(--mute); }
.tag{ border-radius:5px; padding:1px 8px; font-size:12px; font-weight:600; background:var(--grey-card); color:var(--ink); }
.tag.open{ background:var(--bad-soft); color:var(--bad); } .tag.ack{ background:var(--amber-soft); color:var(--amber); } .tag.closed{ background:var(--good-soft); color:var(--good); } .tag.rev{ background:var(--accent-soft); color:var(--accent-ink); }
.imp{ text-align:right; white-space:nowrap; } .imp b{ display:block; font-size:15px; } .imp span{ color:var(--mute); font-size:12px; }
/* drawer */
.drawer{ position:fixed; top:0; right:0; bottom:0; width:min(500px,100%); background:var(--card); border-left:1px solid var(--line); z-index:50; transform:translateX(102%); transition:transform .22s ease; display:flex; flex-direction:column; box-shadow:-12px 0 40px rgba(28,24,56,.14); }
.drawer.open{ transform:none; }
.drawer-h{ padding:calc(20px + env(safe-area-inset-top,0px)) 24px 14px; border-bottom:1px solid var(--line-2); display:flex; gap:10px; align-items:flex-start; }
.drawer-h h3{ margin:0; font-size:20px; }
.drawer-h .x{ margin-left:auto; border:0; background:var(--grey-card); width:32px; height:32px; border-radius:8px; font-size:18px; flex:none; }
.drawer-b{ overflow:auto; padding:18px 24px calc(30px + env(safe-area-inset-bottom,0px)); }
.bigv{ font-size:34px; font-weight:700; letter-spacing:-.02em; }
.h4{ font-weight:700; font-size:14px; margin:22px 0 6px; }
.read{ background:var(--sky); color:var(--ink); border-radius:8px; padding:12px 14px; font-size:14px; }
.read b{ color:var(--accent-ink); }
.para{ margin:0 0 6px; font-size:14px; }
.askq{ border-left:3px solid var(--orange); padding:4px 0 4px 12px; font-size:14px; color:var(--ink); }
.dl{ display:grid; grid-template-columns:100px 1fr; gap:5px 12px; font-size:13px; margin:10px 0 0; color:var(--mute); }
.dl dt{ color:var(--mute); } .dl dd{ margin:0; color:var(--ink); }
table.t{ width:100%; border-collapse:collapse; font-size:13.5px; font-variant-numeric:tabular-nums; }
table.t th{ text-align:right; color:var(--mute); font-weight:500; padding:7px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
table.t th:first-child, table.t td:first-child{ text-align:left; }
table.t td{ text-align:right; padding:8px; border-bottom:1px solid var(--line-2); }
table.t tr.click{ cursor:pointer; } table.t tr.click:hover td{ background:var(--grey-card); }
table.t tr.total td{ font-weight:700; border-top:1px solid var(--line); }
.tw{ overflow-x:auto; }
.splits{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; }
.splits button{ border:1px solid var(--line); background:var(--card); border-radius:6px; padding:4px 11px; font-size:12.5px; }
.splits button.on{ background:var(--accent); color:#fff; border-color:var(--accent); }
.scrim{ position:fixed; inset:0; background:rgba(20,16,44,.3); z-index:40; display:none; }
.scrim.on{ display:block; }
/* page headings */
.ph{ margin:0 0 20px; } .ph h2{ font-size:27px; margin:0 0 6px; font-weight:700; letter-spacing:-.02em; } .ph p{ color:var(--mute); margin:0; max-width:760px; font-size:15px; }
/* overview */
.hero{ background:var(--card); border:1px solid var(--line); border-top:4px solid var(--orange); border-radius:14px; padding:28px 30px 26px; margin-bottom:22px; position:relative; overflow:hidden; }
.hero .when{ font-size:13.5px; color:var(--mute); font-weight:600; margin-bottom:6px; }
.hero h2{ font-size:30px; line-height:1.25; margin:0 0 10px; font-weight:700; letter-spacing:-.02em; }
.hero p{ font-size:16px; margin:0; }
.hero-stats{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:0; margin-top:22px; }
.hero-stats div{ border-left:2px solid var(--orange); padding:0 26px 0 14px; margin-bottom:8px; }
.hero-stats b{ display:block; font-size:28px; font-weight:700; letter-spacing:-.02em; }
.hero-stats span{ font-size:13px; color:var(--ink); }
.ov-sec{ display:grid; grid-template-columns:280px 1fr; gap:28px; padding:26px 0; border-top:1px solid var(--line); }
.ov-sec h3{ font-size:19px; margin:0 0 6px; line-height:1.3; }
.ov-sec .side-note{ color:var(--mute); font-size:13.5px; }
.walk{ display:grid; grid-template-columns:200px 1fr 92px; gap:6px 14px; align-items:center; font-size:14px; }
.walk .wl{ } .walk .wl small{ display:block; color:var(--mute); font-size:12px; }
.walk .wb{ position:relative; height:24px; }
.walk .wb div{ position:absolute; top:3px; height:18px; border-radius:3px; }
.walk .wv{ text-align:right; font-weight:700; font-variant-numeric:tabular-nums; }
.walk .tot .wl{ font-weight:700; }
.eq{ display:flex; flex-wrap:wrap; align-items:stretch; gap:10px; margin:6px 0 14px; }
.eq .t{ background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; min-width:150px; cursor:pointer; text-align:left; }
.eq .t:hover{ border-color:var(--accent); }
.eq .t b{ display:block; font-size:21px; } .eq .t span{ font-size:12.5px; color:var(--mute); }
.eq .o{ align-self:center; font-size:20px; color:var(--mute); font-weight:700; }
.levers3{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:0; }
.levers3 > div{ padding:0 20px; border-left:1.5px solid var(--line); display:flex; flex-direction:column; }
.levers3 > div:first-child{ border-left:0; padding-left:0; }
.levers3 h4{ font-size:15.5px; margin:0 0 4px; }
.levers3 .big{ font-size:26px; font-weight:700; letter-spacing:-.02em; margin:6px 0 2px; }

.lv-links{ display:flex; gap:16px; margin:10px 0 0 !important; }
.plist{ margin:0; padding-left:18px; font-size:14px; } .plist li{ margin-bottom:4px; }
.linkb{ border:0; background:none; color:var(--accent-ink); font-weight:600; padding:0; text-decoration:underline; text-underline-offset:3px; font-size:13.5px; }
.gloss{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px 30px; }
.gloss div{ font-size:13.5px; } .gloss b{ display:block; font-size:14px; }

.preset{ display:grid; grid-template-columns:22px 220px 1fr auto; gap:14px; align-items:center; background:none; border:0; border-top:1px solid var(--line-2); padding:13px 18px; text-align:left; }

.rp-top{ display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:14px; }

.rp{ display:grid; grid-template-columns:54px 1.6fr 1.2fr 1fr 110px; gap:16px; align-items:center; width:100%; background:none; border:0; border-top:1px solid var(--line-2); padding:15px 20px; text-align:left; }

.modal{ position:fixed; inset:0; z-index:60; display:none; align-items:flex-start; justify-content:center; padding:calc(30px + env(safe-area-inset-top,0px)) 16px 30px; overflow:auto; background:rgba(20,16,44,.35); }
.modal.on{ display:flex; }
.sheet{ background:var(--card); border-radius:14px; width:min(980px,100%); padding:28px 32px; position:relative; }
.sheet .x{ position:absolute; right:16px; top:16px; border:0; background:var(--grey-card); width:34px; height:34px; border-radius:8px; font-size:18px; }
.sheet h3{ font-size:22px; margin:0 0 4px; } .sheet .sub{ color:var(--mute); margin-bottom:18px; }

.ask{ max-width:960px; }
.qs{ display:flex; flex-wrap:wrap; gap:8px; margin:12px 0 24px; }

.qs button:hover{ border-color:var(--accent); color:var(--accent-ink); }

.ask-bar input{ flex:1; border:1.5px solid var(--line); border-radius:10px; padding:12px 14px; font:inherit; font-size:15px; background:var(--card); color:var(--ink); }
.ask-bar input:focus{ border-color:var(--accent); outline:none; }
/* alerts */
.al-top{ display:grid; grid-template-columns:1fr auto; gap:16px; align-items:start; }
.counts{ display:flex; }
.counts div{ border-left:1.5px solid var(--line); padding:0 20px 0 14px; } .counts div:first-child{ border-left:0; } .counts b{ font-size:26px; display:block; line-height:1.1; } .counts span{ color:var(--mute); font-size:13px; }
.al-grid{ display:grid; grid-template-columns:1.25fr 1fr; gap:18px; align-items:start; }
.al-list{ background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
.al-card{ padding:14px 18px; border-top:1px solid var(--line-2); display:grid; grid-template-columns:12px 1fr auto; gap:12px; cursor:pointer; }
.al-card:first-child{ border-top:0; }
.al-card.on{ background:var(--accent-soft); }
.al-card .rule{ color:var(--mute); font-size:12.5px; } .al-card .tt{ font-weight:600; font-size:14.5px; margin:2px 0; }

.al-detail h3{ font-size:21px; margin:8px 0 8px; line-height:1.3; }

.why-li{ display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid var(--line-2); cursor:pointer; }

.sowhat{ background:var(--sky); border-radius:8px; padding:12px 14px; font-size:14px; }
.subtabs{ display:flex; gap:24px; border-bottom:1px solid var(--line); margin:4px 0 14px; }
.subtabs button{ border:0; background:none; padding:9px 0; font-size:14.5px; color:var(--mute); border-bottom:2.5px solid transparent; margin-bottom:-1px; }
.subtabs button.on{ color:var(--ink); border-color:var(--orange); font-weight:700; }
.pill-f{ display:inline-flex; gap:2px; border:1px solid var(--line); padding:3px; border-radius:8px; margin-bottom:12px; flex-wrap:wrap; background:var(--grey-card); }
.pill-f button{ border:0; background:none; padding:5px 12px; border-radius:6px; font-size:13px; color:var(--mute); }
.pill-f button.on{ background:var(--card); color:var(--ink); font-weight:600; box-shadow:0 1px 2px rgba(28,24,56,.1); }
.empty{ color:var(--mute); padding:20px; }
.del{ border:0; background:none; color:var(--bad); font-size:12.5px; font-weight:600; padding:0 0 0 8px; text-decoration:underline; text-underline-offset:2px; }
.savebar{ display:flex; gap:8px; margin-top:14px; } .savebar[hidden]{ display:none; }

.savebar input{ flex:1; }
.form{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px 16px; margin:8px 0 16px; } .form[hidden]{ display:none; }
.form label{ display:flex; flex-direction:column; gap:4px; font-size:13px; font-weight:600; }

.ck{ font-size:13.5px; display:flex; gap:6px; align-items:center; } .ck small{ color:var(--mute); }
.comments{ border-top:1px solid var(--line); margin-top:22px; padding-top:16px; } .comments h4{ margin:0 0 10px; font-size:15px; }
.cmt{ border-left:3px solid var(--orange); padding:4px 0 4px 12px; margin-bottom:12px; } .cmt-h{ display:flex; gap:10px; align-items:baseline; font-size:13px; } .cmt-h span{ color:var(--mute); } .cmt p{ margin:4px 0 0; font-size:14px; }
.cmt-form{ display:grid; gap:8px; max-width:640px; } .cmt-form button{ justify-self:start; }
.trend{ margin-top:12px; } .trend-h{ font-size:12.5px; color:var(--mute); font-weight:600; margin-bottom:2px; }
.preset .del{ margin-left:6px; }
@media (max-width:860px){ .form,.cks{ grid-template-columns:1fr; } }

  .brand{ padding:0 8px 0 4px; } .brand span{ display:none; } .brand img{ width:120px !important; }
  .nav{ flex-direction:row; } .nav button{ padding:8px 10px; } .nav button .lab{ display:none; }
  .side-foot{ display:none; }

  .levers3,.gloss{ grid-template-columns:1fr; } .levers3 > div{ border-left:0; padding:0 0 14px; }

    const cap=S.fees!=null?S.fees:S.oth; const hit=Math.min(preS,cap); S.insCapped=preS>cap+1e-9; S.insCap=cap; S.insPre=preS;

  S.c2iCalc=S.opx/S.nti; calcRatios(S); if(sc.kind!=='base') S.eps=null; S.layer='scenario';
}

(function(){

const C=window.CLIENT;
let A=null; // platform API, set on first call
const api=x=>{ A=x; return x; };
const pct=(a,b)=>(a!=null&&b)?(a/b-1)*100:null;
function sgn(v,dp){ if(v==null||!isFinite(v)) return '–'; return (v>=0?'+':A.MINUS)+A.num(Math.abs(v),dp); }
function cr(v,dp){ return A.rs(v,dp==null?1:dp)+' cr'; }
const chip=(id,l)=>`<span class="ref-chip" data-on="${id}">${A.esc(l||C.N[id].l)}</span>`;

/* ---------- PAT variance bridge (exact) ---------- */
const BR_STEPS=[['il','Loan interest income',1],['ie','Funding expense',-1],['da','Loan-sale gains',1],['oth','Fees, treasury and other',1],['opx','Operating expenses',-1],['cc','Credit cost',-1],['mitig','Assumed mitigation',1],['tax','Tax',-1]];
function patBridge(S,Cm){ if(!S||!Cm) return null; const steps=BR_STEPS.map(([k,l,s])=>({k,l,v:s*((S[k]||0)-(Cm[k]||0))})).filter(x=>Math.abs(x.v)>0.005||x.k!=='mitig');
  return {a:S.pat,b:Cm.pat,steps}; }
function phrase(x){ const v=Math.abs(x.v); const up=x.v>=0;
  const map={il:up?'loan interest added':'loan interest fell by',ie:up?'funding expense fell by':'funding expense took',da:up?'loan-sale gains added':'loan-sale gains fell by',oth:up?'fees, treasury and other added':'fees, treasury and other fell by',opx:up?'operating expenses fell by':'operating expenses took',cc:up?'credit cost fell by':'credit cost took',mitig:'assumed mitigation added',tax:up?'tax fell by':'tax took'};
  return `${map[x.k]} ${cr(v)}${(!up&&['ie','opx','cc','tax'].includes(x.k))?' more':''}`; }

/* ---------- story (page head) ---------- */
function story(st,S,Cm){ A=A||window.PLATFORM; if(!S) return {h:'No data for this period.',k:''};
  const per=A.P_BY[st.p].l, lbl=A.cmpLabel();
  if(st.treeSc){ return {h:`In the illustrative scenario, Q2 FY27 profit after tax would be ${cr(S.pat)}, ${cr(Math.abs(S.pat-Cm.pat))} ${S.pat>=Cm.pat?'above':'below'} actual.`,k:'Every box below is recalculated from the same balances; reported figures are unchanged.'}; }
  if(st.dim.m){ return {h:`${A.esc(st.dim.m)} holds ${A.num(C.DIMS.find(d=>d.k===st.dim.k).share(st.dim.m,S.endKey)||0,1)}% of AUM at ${A.esc(S.P.end)}.`,k:'Disclosed as a share of AUM. Earnings, funding and returns are company level.'}; }
  if(st.persp==='op'&&S.aum!=null){ const g2=S.aumGrowth; return {h:`Disbursals of ${cr(S.disb,0)} took AUM to ${cr(S.aum,0)} in ${per}, up ${A.num(g2*100,1)}% in the period.`,k:`Implied net run-off was ${cr(S.runoff,0)}, ${A.num(S.runoffRate*100,1)}% of opening AUM annualised${Cm&&Cm.disb?`; disbursals ${sgn(pct(S.disb,Cm.disb),1)}% against ${lbl}`:''}.`}; }
  if(st.persp==='board'&&S.roe!=null){ return {h:`ROE was ${A.num(S.roe,1)}% in ${per}, on ROA of ${A.num(S.roa,1)}% and leverage of ${A.num(S.lev,1)}x.`,k:Cm&&Cm.roe!=null?`Against ${lbl}: ROE ${A.num(Cm.roe,1)}%, ROA ${A.num(Cm.roa,1)}%, leverage ${A.num(Cm.lev,1)}x. Published ratios; CRAR ${A.num(S.crar,1)}% as reported.`:''}; }
  if(st.persp==='demo'&&S.d){ const d=S.d; const lo=d.cl.slice().sort((a,b)=>a.dpe-b.dpe)[0], hi=d.cl.slice().sort((a,b)=>b.dpe-a.dpe)[0];
    return {h:`Illustrative: disbursals per employee range from ${cr(lo.dpe,1)} a year in ${lo.name} to ${cr(hi.dpe,1)} in ${hi.name}.`,k:'Synthetic branch-cluster and connector detail with neutral names. Cluster and group totals reconcile to the public company figures for the quarter.'}; }
  const g=pct(S.pat,Cm&&Cm.pat);
  const h=`HomeFirst earned ${cr(S.pat)} in ${per}${g!=null?`, ${A.num(Math.abs(g),1)}% ${g>=0?'more':'less'} than in ${lbl}`:''}.`;
  let k=''; const br=patBridge(S,Cm); if(br){ const top=br.steps.slice().sort((x,y)=>Math.abs(y.v)-Math.abs(x.v)).slice(0,3); k=`Against ${lbl}, ${top.map(phrase).join(', ').replace(/, ([^,]*)$/,' and $1')}.`; k=k.charAt(0).toUpperCase()+k.slice(1); }
  return {h,k}; }

    s=`<b>${word} ${A.esc(lbl)}</b>: ${A.fvs(meta.u,r.v)} against ${A.fvs(meta.u,b.v)} (${dl.txt}). `; } }
  const x={

   ie:()=>S.taAvg&&S.cob!=null?`Approximate driver: average assets ${cr(S.taAvg,0)} × borrowings ${A.num(S.iblS,1)}% × cost of borrowing ${A.num(S.cob,1)}% × ${A.num(S.frac,2)} of a year = ${cr(S.taAvg*S.iblS/100*S.cob/100*S.frac,1)}, against ${cr(S.ie,1)} reported.`:'Average total assets are not disclosed for this period, so the driver product cannot be formed.',
   disb:()=>'Counted in rupees disbursed, including tranches and top-ups. Loan counts, sanctions and logins are not disclosed by period.',
   cc:()=>'The indicators beneath are explanatory: roll rates, exposure and loss severity by cohort are not disclosed.',
   oth:()=>'Fees include insurance commission; its share is not disclosed. In Q2 FY27, fees were ₹26.2 cr and fair-value gains ₹12.1 cr.',

  const dR=F26.roa-F25.roa, dL=F26.lev-F25.lev; const eR=dR*(F25.lev+F26.lev)/2, eL=dL*(F25.roa+F26.roa)/2;
  A.modal(`<h3>Why ROE fell in FY26 while ROA rose</h3><div class="sub">Arithmetic decomposition, symmetric attribution (interaction split equally). Calculated from opening and closing balances, the company’s method.</div>
   ${A.tableHTML(['','FY25','FY26','Change'],[['ROA, %',A.num(F25.roa,2),A.num(F26.roa,2),sgn(dR,2)],['Leverage, x',A.num(F25.lev,2),A.num(F26.lev,2),sgn(dL,2)],['ROE, %',A.num(F25.roe,2),A.num(F26.roe,2),sgn(F26.roe-F25.roe,2)]])}
   ${A.tableHTML(['Effect on ROE','Points'],[['Higher ROA',sgn(eR,2)],['Lower leverage after the ₹1,250 Cr QIP (April 2025)',sgn(eL,2)]],['Change in ROE',sgn(eR+eL,2)])}
   <p class="deck-note">Pre-money FY26 ROE of 16.8% as reported (“adjusted for QIP”; method undisclosed). Sources: ${A.linkSrc('S4 p357')}; ${A.linkSrc('S1 slide 45')}; ${A.linkSrc('S4 p180')}.</p>
   <p><button class="btn" id="bkTree">Return to the value tree</button></p>`);

function renderReport(r,st){ const S=A.vals(st.p), ck=A.cmpKey(), Cm=ck?A.vals(ck):null, per=A.P_BY[st.p].l, lbl=A.cmpLabel(); let body='', obs=[];
  const d=(u,a,b,dir)=>{ const x=A.delta(u,a,b,dir); return x.txt?`<span class="dchip ${x.cls}">${x.txt.split(' ')[0]}</span>`:'–'; };
  const row=id=>{ const m=A.nd(id); return [`<span class="ref-chip" data-on="${id}">${A.esc(m.l)}</span>`,A.fv(m.u,m.v(S)).m,Cm?A.fv(m.u,m.v(Cm)).m:'–',Cm?d(m.u,m.v(S),m.v(Cm),m.dir):'–']; };
  if(r.r==='ceo'){ const br=patBridge(S,Cm);
    body=`<div class="mini-kpis">${[['pat','PAT'],['nii','NII'],['aum','AUM'],['disb','Disbursals'],['c2iCalc','Cost-to-income'],['gs3','Gross Stage 3']].map(([id,l])=>{ const m=A.nd(id); return `<div><span>${l}</span><b>${A.fvs(m.u,m.v(S))}</b></div>`; }).join('')}</div>`
     +(br?A.tableHTML(['What moved PAT','₹ cr'],br.steps.map(s=>[A.esc(s.l),sgn(s.v,1)]),['Change in PAT',sgn(br.a-br.b,1)]):'');
    const st0=story(st,S,Cm); obs.push(st0.h,st0.k); }
  else if(r.r==='pl'){ body=A.tableHTML(['₹ crore',A.esc(per),A.esc(lbl),'Change'],['il','ie','nii','da','oth','nti','opx','ppop','cc','pbt','tax','pat'].map(row)); const br=patBridge(S,Cm); if(br){ const top=br.steps.slice().sort((x,y)=>Math.abs(y.v)-Math.abs(x.v))[0]; obs.push(`The largest single move against ${lbl} was ${top.l.toLowerCase()}, ${sgn(top.v,1)} cr.`); } obs.push('Lease interest is in operating expenses, as the company reports; the NII bridge to the statutory figure is in Sources.'); }
  else if(r.r==='book'){ body=A.tableHTML(['₹ crore',A.esc(per),A.esc(lbl),'Change'],['aumOpen','disb','runoff','aum','runoffRate'].map(row));
    const D=C.DIMS[0]; const sh=D.members.map(m=>[m,D.share(m,S.endKey)]).filter(x=>x[1]!=null);
    if(sh.length) body+=`<div class="h4">State mix at ${A.esc(S.P.end)}</div>`+A.tableHTML(['State','Share of AUM','₹ Cr'],sh.map(([m,v])=>[A.esc(m),A.num(v,1)+'%',A.num(S.aum*v/100,0)]));
    else body+='<div class="deck-note">State mix not disclosed for this period end.</div>';
    obs.push('Run-off is derived and includes balance transfers out. State, product and borrower splits are disclosed as shares of AUM, one at a time.'); }
  else if(r.r==='aq'){ body=seriesTable(['bounce','ce','dpd1','dpd30','s2','gs3','cc'],'Quarter'); obs.push('Indicators describe movement; roll rates, exposure and loss severity by cohort would be needed to explain the credit-cost charge.'); }
  else if(r.r==='demo'){ const Sx=A.vals(st.p); if(!Sx.d){ body='<div class="deck-note">The illustrative layer covers Q1 and Q2 FY27.</div>'; } else { const Cx=ck?A.vals(ck):null; body=demoPanels(st,Sx,Cx,true); const t=Sx.d.tot; obs.push(`Illustrative data with neutral names. Cluster contribution after funding (${cr(t.after,2)}) plus loan-sale gains (${cr(t.da,2)}) plus treasury and other income held centrally (${cr(t.treas,2)}), less unallocated central costs (${cr(t.central,2)}), equals company PBT of ${cr(t.pbt,2)}.`); } }
  else if(r.r==='fund'){ body=A.tableHTML(['',A.esc(per),A.esc(lbl),'Change'],['yld','cob','spr','fund','f_bank','f_nhb','f_off','f_mkt','eqEnd','liq','crar'].map(row)); obs.push('Funding-mix amounts are disclosed shares × total funding, so they carry rounding. CRAR is reported, not recalculated.'); }
  A.modal(`<div style="color:var(--mute);font-weight:600">${r.id}</div><h3>${A.esc(r.l)}</h3><div class="sub">${A.esc(per)} against ${A.esc(lbl)}. Scope: whole company. Data basis: ${r.r==='demo'?'synthetic operating layer (company totals public)':A.esc(A.basisText())}. For ${A.esc(r.to)}.</div>${body}
   <div class="h4">Observations</div>${obs.filter(Boolean).map(o=>`<p style="margin:4px 0">${o}</p>`).join('')}
   <div class="h4">Analyst commentary</div><p class="deck-note" style="margin:0">Reserved for HomeFirst’s finance team; not generated.</p>
   <p style="margin-top:14px"><button class="btn" onclick="window.print()">Print or save as PDF</button></p>`); }
function bindRp(p,st,AP){ A=AP; p.querySelectorAll('[data-rp]').forEach(b=>b.onclick=()=>renderReport(REPORTS.find(r=>r.id===b.dataset.rp),st)); }

/* ---------- example questions ---------- */
const QUESTIONS=['Why did PAT change against the comparison?','What explains the movement in NII?','How much did operating costs contribute?','What is driving disbursal growth?','How does the insurance scenario affect earnings?','What happens during a funding and repricing lag?','Which branch clusters are behind plan? (illustrative)'];
function answer(q,st){ const S=A.vals(st.p), ck=A.cmpKey(), Cm=ck?A.vals(ck):null, per=A.P_BY[st.p].l, lbl=A.cmpLabel(); const basis=`<p class="deck-note">Data basis: ${A.esc(A.basisText())}. ${A.esc(per)} against ${A.esc(lbl)}.</p>`;
  const noC=`<p>No comparison period is available for ${A.esc(per)}.</p>`;
  if(q===QUESTIONS[0]){ if(!Cm) return noC; const br=patBridge(S,Cm); return `<p>${chip('pat')} was ${cr(S.pat)} against ${cr(Cm.pat)}, ${sgn(S.pat-Cm.pat,1)} cr.</p><p>By line: ${br.steps.map(s=>`${s.l.toLowerCase()} ${sgn(s.v,1)}`).join(', ')}. These add exactly to the change.</p>`+basis; }
  if(q===QUESTIONS[1]){ if(!Cm) return noC; return `<p>${chip('nii')} was ${cr(S.nii)} against ${cr(Cm.nii)} (${sgn(pct(S.nii,Cm.nii),1)}%). ${chip('il')} moved ${sgn(S.il-Cm.il,1)} cr and ${chip('ie')} ${sgn(S.ie-Cm.ie,1)} cr.</p>${S.cob!=null&&Cm.cob!=null?`<p>Cost of borrowing moved from ${A.num(Cm.cob,1)}% to ${A.num(S.cob,1)}%; portfolio yield from ${A.num(Cm.yld,1)}% to ${A.num(S.yld,1)}%.</p>`:''}<p>NII is the company definition; the press figure (₹267 cr in Q2 FY27) also counts non-loan interest.</p>`+basis; }
  if(q===QUESTIONS[2]){ if(!Cm) return noC; const dOx=S.opx-Cm.opx; return `<p>${chip('opx')} were ${cr(S.opx)} against ${cr(Cm.opx)} (${sgn(pct(S.opx,Cm.opx),1)}%). The pre-tax earnings effect is ${sgn(-dOx,1)} cr; at the period’s effective tax rate of ${A.num(S.tax/S.pbt*100,1)}%, that is about ${sgn(-dOx*(1-S.tax/S.pbt),1)} cr of PAT.</p><p>${chip('c2iCalc')} moved from ${A.num(Cm.c2iCalc*100,1)}% to ${A.num(S.c2iCalc*100,1)}%${S.opxA!=null?`; operating expenses were ${A.num(S.opxA,1)}% of average assets`:''}.</p>`+basis; }
  if(q===QUESTIONS[3]){ if(S.disb==null) return '<p>Disbursals are not disclosed for this period.</p>'+basis; return `<p>${chip('disb')} were ${cr(S.disb,0)}${Cm&&Cm.disb?` against ${cr(Cm.disb,0)} (${sgn(pct(S.disb,Cm.disb),1)}%)`:''}.${S.disbPerEmp?` About ${cr(S.disbPerEmp,1)} a year per employee, with ${A.num(S.emp,0)} employees and ${A.num(S.br,0)} branches.`:''}</p><p><b>To test:</b> management has said roughly half of disbursal growth comes from larger tickets. Loan counts and sanctions are not disclosed, so volume and ticket cannot be separated from public data.</p>`+basis; }
  if(q===QUESTIONS[4]){ const p=PRESETS[0]; const X=A.vals('Q2FY27',{...p.sc,kind:'ins'}), B=A.vals('Q2FY27'); return `<p>Using management’s estimates (shock 35 bps, concession 10, assumed mitigation 20), Q2 FY27 ${chip('pat')} would be ${cr(X.pat)} against ${cr(B.pat)}: ${sgn((X.pat-B.pat)*4,1)} cr a year.</p><p>Without concession or mitigation: ${sgn(annDelta({...PRESETS[1].sc,kind:'ins'}),1)} cr a year. The rule’s effective date is undisclosed.</p><p class="deck-note">Illustrative scenario on public Q2 FY27 balances.</p>`; }
  if(q===QUESTIONS[5]){ const p=PRESETS[2]; const B=A.vals('Q2FY27'); const ps=[0,1,2,3].map(i=>(A.vals('Q2FY27',{...p.sc,kind:'fun',show:i}).pat-B.pat)*4); return `<p>After a 25 bps repo rise, with 25% passing through in quarter 1 and 40% from quarter 2, annualised PAT changes by ${ps.map((v,i)=>`Q${i+1} ${sgn(v,1)} cr`).join(', ')}.</p><p>The cost sits in the two quarters before HomeFirst reprices; once repriced, an equal rate change earns slightly more on loans than it costs on borrowings.</p><p class="deck-note">Illustrative scenario on public Q2 FY27 balances; balance-sheet size and mix held constant.</p>`; }
  if(q===QUESTIONS[6]){ const D=C.DEMO('Q2FY27'), P=C.DEMO('PLAN_Q2FY27'); const rows=D.cl.map((x,i)=>({n:x.name,a:x.disb,p:P.cl[i].disb})).map(r=>({...r,g:(r.a/r.p-1)*100})).sort((a,b)=>a.g-b.g); const behind=rows.filter(r=>r.g<-10);
    return `<p><b>Illustrative data.</b> Against the illustrative Q2 FY27 plan, ${behind.length?behind.map(r=>`${r.n} disbursed ${cr(r.a,1)} against ${cr(r.p,1)} (${sgn(r.g,1)}%)`).join('; '):'no cluster is more than 10% behind'}.</p><p>The data show the gap, not its cause. Branch vintage, staffing and local demand would be the first checks.</p><p class="deck-note">Synthetic branch-cluster data; company total equals the public Q2 FY27 disbursals.</p>`; }
  return ''; }
function viewAsk(st,AP){ A=AP; const per=A.P_BY[st.p].l;
  return `<div class="ask"><div class="ph"><h2>Example questions</h2><p>Prepared questions with answers calculated from the model for ${A.esc(per)}. Underlined terms open the box they come from. Free-form questions are not supported in this demonstration.</p></div>
   ${st.convo.length?'':`<div class="qs">${QUESTIONS.map(q=>`<button data-q="${A.esc(q)}">${A.esc(q)}</button>`).join('')}</div>`}
   <div class="convo">${st.convo.map(c=>`<div class="q-b">${A.esc(c.q)}</div><div class="a-b">${answer(c.q,st)}</div>`).join('')}</div>${st.convo.length?`<p class="deck-note">Answers recalculate for the period and comparison selected above.</p>`:''}
   ${st.convo.length?`<div class="qs" style="margin-top:0">${QUESTIONS.filter(q=>!st.convo.find(c=>c.q===q)).map(q=>`<button data-q="${A.esc(q)}">${A.esc(q)}</button>`).join('')}</div>`:''}</div>`; }
function bindAsk(p,st,AP){ A=AP; p.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{ const q=b.dataset.q; st.convo.push({q}); AP.renderPage(); const c=p.querySelectorAll('.a-b'); if(c.length) c[c.length-1].scrollIntoView({block:'center'}); }); }

const RULES=[
 ['A1','Bounce rate rising after quarter end','Monthly bounce rate against the quarter','More than 0.5 pt above the quarter','Head, Collections'],
 ['A2','Repricing lag after a rate rise','Policy rate, cost of borrowing, lending rate','Policy rate up 25 bps or more with no lending-rate change','Treasurer, ALCO'],
 ['A3','Fees, treasury and other below last year','Fees, treasury and other, same quarter last year','More than 5% lower','CFO'],
 ['A4','Co-lending volume below the previous quarter','Co-lending disbursals','More than 50% lower','Head, Partnerships'],
 ['A5','Operating cost growing faster than income','Operating expenses against net total income, same quarter last year','Cost growth above income growth','CFO'],
 ['A6','Reported capital near covenant','CRAR against the 20% NCD covenant','Within 10 pts of the covenant','CFO'],
 ['A7','Branch cluster disbursals behind plan (illustrative)','Disbursals by cluster against the illustrative plan','More than 10% behind','Zonal business heads'],
 ['A8','Sourcing group early defaults above limit (illustrative)','DPD 30+ at 6 months on book, by group','Above 1.5%','Head, Credit; Head, Partnerships']];
function alerts(st){ A=A||window.PLATFORM; const S=A.vals(st.p); const P=A.P_BY[st.p]; const LY=P.ly?A.vals(P.ly):null, LP=P.lp?A.vals(P.lp):null; const out=[];
  if(!S) return out;
  if(st.p==='Q2FY27') out.push({id:'A1',rule:RULES[0][1],status:'watch',title:'October bounce rate 16.6%, 1.0 pt above the Q2 FY27 average of 15.6%',owner:RULES[0][4],node:'bounce',what:'The bounce rate on EMI presentation was 16.6% in October 2026 against 15.6% for Q2 FY27 (company disclosure).',expl:'Management attributes the October rise to the 4th of the month falling on a weekend and notes last October was higher (Q2 FY27 call, 26:20). Not yet verified against later months.',next:'Compare November and December readings; review by branch cluster once internal data are connected.',imp:null,src:'S1 slide 30; Q2 FY27 call, 26:20'});
  if(st.p==='Q2FY27'){ const p=PRESETS[2]; const B=A.vals('Q2FY27'); const w=Math.min(...[0,1,2,3].map(i=>(A.vals('Q2FY27',{...p.sc,kind:'fun',show:i}).pat-B.pat)*4));
    out.push({id:'A2',rule:RULES[1][1],status:'open',title:'Repo rate up 25 bps (MPC, 5–7 Oct 2026); cost of borrowing flat at 7.8% and lending rate unchanged',owner:RULES[1][4],node:'ie',what:'RBI raised the repo rate 25 bps to 5.50% at its 5–7 Oct 2026 meeting. Cost of borrowing was 7.8% in Q1 and Q2 FY27; HomeFirst has not changed its lending rate.',expl:'Management reprices after a 10–15 bps move in its own borrowing cost (Q2 FY27 call, 46:04).',next:'Track transmission monthly; set the repricing decision point in ALCO.',imp:{v:w,t:'annualised PAT in the weakest quarter (illustrative scenario)'},src:'S10; S1 slide 29; Q2 FY27 call, 46:04'}); }
  if(LY&&S.oth<LY.oth*0.95){ out.push({id:'A3',rule:RULES[2][1],status:'watch',title:`Fees, treasury and other ${cr(S.oth)} against ${cr(LY.oth)} in ${A.P_BY[P.ly].l} (${sgn(pct(S.oth,LY.oth),1)}%)`,owner:RULES[2][4],node:'oth',what:`The line fell ${cr(LY.oth-S.oth)} on the same quarter last year.${st.p==='Q2FY27'?' Statutory lines show fees and commission higher (₹26.2 cr against ₹21.3 cr) and fair-value gains lower (₹12.1 cr against ₹20.5 cr).':''}`,expl:st.p==='Q2FY27'?'Observed in the statutory lines (scanned filing, read with care). The insurance-commission share of fees is undisclosed.':'Component lines not extracted for this period.',next:'Split treasury income from fee income in the monthly pack.',imp:{v:(S.oth-LY.oth),t:'observed movement, pre-tax; to explain, not established as a loss'},src:'S1 slide 41; S2 p5'}); }
  if(LP&&S.clV!=null&&LP.clV!=null&&S.clV<LP.clV*0.5){ out.push({id:'A4',rule:RULES[3][1],status:'open',title:`Co-lending disbursals ${cr(S.clV)} against ${cr(LP.clV)} in ${A.P_BY[P.lp].l}`,owner:RULES[3][4],node:'f_off',what:'Co-lending volume fell sharply quarter on quarter.',expl:'Management attributes it to partners implementing new RBI co-lending guidelines and expects an uptick in Q3 FY27 (Q2 FY27 call, 39:34).',next:'Confirm partner readiness dates; track Q3 volume.',imp:null,src:'S1 slide 35; Q2 FY27 call, 39:34'}); }
  if(LY){ const og=pct(S.opx,LY.opx), ig=pct(S.nti,LY.nti); if(og>ig) out.push({id:'A5',rule:RULES[4][1],status:'open',title:`Operating expenses ${sgn(og,1)}% against net total income ${sgn(ig,1)}%`,owner:RULES[4][4],node:'opx',what:'Cost grew faster than income on the same period last year.',expl:'',next:'Review cost lines against growth plans.',imp:{v:-(S.opx-LY.opx*(1+ig/100)),t:'pre-tax, against cost growing with income'},src:'S1 slide 41'}); }
  if(S.crar!=null&&S.crar<30) out.push({id:'A6',rule:RULES[5][1],status:'open',title:`CRAR ${A.num(S.crar,1)}% at ${S.P.end}`,owner:RULES[5][4],node:'crar',what:'Reported capital adequacy within 10 pts of the 20% covenant.',expl:'',next:'Review the capital plan.',imp:null,src:'S1 slide 43'});
  if(st.p==='Q2FY27'){ const D=C.DEMO('Q2FY27'), Pl=C.DEMO('PLAN_Q2FY27'); const behind=D.cl.map((x,i)=>({n:x.name,a:x.disb,p:Pl.cl[i].disb})).filter(r=>r.a<r.p*0.9);
    if(behind.length) out.push({id:'A7',rule:RULES[6][1],status:'open',illus:true,open:behind.map(r=>({t:'cluster',i:D.cl.findIndex(x=>x.name===r.n)})),scope:'Branch clusters (illustrative)',title:`${behind.map(r=>r.n).join(' and ')} disbursed ${behind.map(r=>`${sgn((r.a/r.p-1)*100,0)}%`).join(' and ')} against plan`,owner:RULES[6][4],node:'d_disb',what:behind.map(r=>`${r.n}: ${cr(r.a,1)} against ${cr(r.p,1)} planned`).join('; ')+'.',expl:'',next:'Review branch vintage, staffing and pipeline for these clusters before drawing conclusions.',imp:{v:behind.reduce((a,r)=>a+(r.a-r.p),0),t:'disbursals against plan, ₹ cr (illustrative)'},src:'Illustrative layer'});
    const hi=D.gr.filter(g=>g.ed>1.5); if(hi.length) out.push({id:'A8',open:hi.map(g=>({t:'group',i:D.gr.indexOf(g)})),scope:'Sourcing groups (illustrative)',rule:RULES[7][1],status:'open',illus:true,title:`${hi.map(g=>g.k).join(', ')}: DPD 30+ at 6 months on book ${hi.map(g=>A.num(g.ed,1)+'%').join(', ')}, against ${A.num(D.G.ed,1)}% for all sources`,owner:RULES[7][4],node:'d_disb',what:'Early delinquency on loans sourced through this group is above the limit.',expl:'The data show the exception, not its cause; sourcing mix, geography and ticket size would be checked before any view on the group.',next:'Compare loan profile and branch mix of the group with other sources.',imp:null,src:'Illustrative layer'}); }
  return out; }
function stTag(a){ return (a.status==='open'?'<span class="tag open">Open (demonstration)</span>':'<span class="tag ack">Watch (demonstration)</span>')+(a.illus?' <span class="tag" style="background:var(--amber-soft);color:var(--amber)">Illustrative data</span>':''); }

function viewAl(st,AP){ A=AP; const all=alerts(st); if(!st.alertSel||!all.find(a=>a.id===st.alertSel)) st.alertSel=all[0]&&all[0].id; const sel=all.find(a=>a.id===st.alertSel);

   <div class="subtabs"><button data-at="feed" class="${st.alertTab==='feed'?'on':''}">This period</button><button data-at="rules" class="${st.alertTab==='rules'?'on':''}">Rules</button></div>`;
  if(st.alertTab==='rules') return h+`<div class="box"><div class="box-h"><h3>Rules</h3></div>${A.tableHTML(['Rule','Looks at','Flags when','Proposed owner','This period'],RULES.map(r=>[`<b>${r[0]}</b> ${A.esc(r[1])}`,A.esc(r[2]),A.esc(r[3]),A.esc(r[4]),all.find(a=>a.id===r[0])?'Triggered':'Not triggered']))}<div class="deck-note">A7 and A8 run on the illustrative operating layer and are labelled as such.</div></div>`;
  h+=`<div class="al-grid"><div class="al-list">${all.map(a=>`<div class="al-card ${a.id===st.alertSel?'on':''}" data-as="${a.id}" tabindex="0"><span class="dot ${a.status==='watch'?'amber':''}"></span><div><div class="rule"><span class="tag" style="margin-right:8px">${a.id}</span>${A.esc(a.rule)}</div><div class="tt">${A.esc(a.title)}</div><div class="tags"><span style="color:var(--mute)">${A.esc(a.owner)}</span>${stTag(a)}</div></div>${impHTML(a)}</div>`).join('')||'<div class="empty">No rule is triggered for this period.</div>'}</div>`;
  if(sel) h+=`<div class="al-detail" style="border-top-color:${sel.status==='watch'?'var(--amber)':'var(--bad)'}"><div class="tags"><span class="tag">${sel.id}</span><b>${A.esc(sel.rule)}</b></div><h3>${A.esc(sel.title)}</h3><div class="tags">${stTag(sel)}<span style="color:var(--mute)">Proposed owner: ${A.esc(sel.owner)}</span></div>
    <div class="sec">Observed</div><div>${A.esc(sel.what)}</div>${sel.expl?`<div class="sec">Explanation offered, not verified</div><div>${A.esc(sel.expl)}</div>`:''}<div class="sec">Threshold</div><div>${A.esc(RULES.find(r=>r[0]===sel.id)[3])}. Scope: ${A.esc(sel.scope||'whole company')}.</div>
    <div class="sec">${sel.open?'Affected units':'Linked metric'}</div>${sel.open?sel.open.map(o=>`<div class="why-li" data-wn="${sel.node}" data-wo="${o.t}:${o.i}"><div><b>${A.esc(o.t==='cluster'?C.DEMO('Q2FY27').cl[o.i].name:C.DEMO('Q2FY27').gr[o.i].k)}</b><span>Open its detail</span></div><span style="color:var(--accent)">›</span></div>`).join(''):`<div class="why-li" data-wn="${sel.node}"><div><b>${A.esc(C.N[sel.node].l)}</b><span>Open the box</span></div><span style="color:var(--accent)">›</span></div>`}
    <div class="sec">Next action</div><div>${A.esc(sel.next)}</div><div class="sec">Source</div><div>${A.linkSrc(sel.src)}</div></div>`;
  return h+`</div>`; }
function bindAl(p,st,AP){ A=AP; p.querySelectorAll('[data-at]').forEach(b=>b.onclick=()=>{ st.alertTab=b.dataset.at; AP.renderPage(); });

<script>

(function(){

/* ---------- formatting ---------- */
function num(v,dp){ if(v==null||!isFinite(v)) return '–'; const s=Math.abs(v).toLocaleString('en-IN',{minimumFractionDigits:dp,maximumFractionDigits:dp}); return (v<0?MINUS:'')+s; }
function rs(v,dp){ if(v==null||!isFinite(v)) return '–'; return (v<0?MINUS:'')+'₹'+num(Math.abs(v),dp); }
function fv(u,v){ if(v==null||!isFinite(v)) return {m:'–',s:''};
  switch(u){ case 'cr': return {m:num(v,1),s:'Cr'}; case 'cr0': return {m:num(v,0),s:'Cr'}; case 'pct': return {m:num(v*100,1)+'%',s:''}; case 'pctv': return {m:num(v,1)+'%',s:''};
   case 'x': return {m:num(v,1)+'x',s:''}; case 'rs': return {m:rs(v,1),s:''}; case 'n0': return {m:num(v,0),s:''}; case 'yr': return {m:num(v,2),s:'yr'}; case 'lakh': return {m:'₹'+num(v,1),s:'lakh'}; }
  return {m:num(v,1),s:''}; }
function fvs(u,v){ const x=fv(u,v); return x.s? x.m+' '+x.s : x.m; }
function isRatio(u){ return u==='pct'||u==='pctv'||u==='x'; }
function delta(u,a,b,dir){ if(a==null||b==null||!isFinite(a)||!isFinite(b)) return {txt:'',cls:'flat'};
  const d=a-b; let txt;
  if(u==='pct'||u==='pctv'){ const pts=u==='pct'?d*100:d; txt=(pts>=0?'+':MINUS)+num(Math.abs(pts),1)+' pts'; if(Math.abs(pts)<0.05) return {txt:'0.0 pts',cls:'flat',d}; }
  else if(u==='yr'){ return {txt:'',cls:'flat',d}; }
  else if(u==='x'){ txt=(d>=0?'+':MINUS)+num(Math.abs(d),1)+'x'; if(Math.abs(d)<0.05) return {txt:'0.0x',cls:'flat',d}; }
  else { const dp=(u==='cr0'||u==='n0')?0:1; if(Math.abs(d)<0.5*Math.pow(10,-dp)) return {txt:num(0,dp),cls:'flat',d};
    let pc=''; if(!(Math.abs(b)<1e-9||(a<0)!==(b<0)||b<0)) pc=' '+(d>=0?'+':MINUS)+num(Math.abs(d/b*100),1)+'%'; txt=(d>=0?'+':MINUS)+(u==='lakh'?num(Math.abs(d),1):num(Math.abs(d),dp))+pc; }
  const cls= !dir? 'flat' : (d*dir>0?'good':'bad');

/* ---------- dimensions (portfolio cuts) ---------- */

function lensText(){ return state.dim.k&&state.dim.m? `${dimDef().l}: ${state.dim.m}` : ''; }

  .replace(/Q2 FY27 call, (\d+):(\d+)/g,(m,a,b)=>{ const u=docUrl('S6'); return u?`<a href="${u}#t=${(+a)*60+(+b)}" target="_blank" rel="noopener">${m}</a>`:m; }); }

/* ---------- navigation ---------- */
const ICONS={ov:'<svg viewBox="0 0 24 24"><path d="M4 19h16M6 16V9M11 16V5M16 16v-5"/></svg>',tree:'<svg viewBox="0 0 24 24"><path d="M4 5v14M4 12h6M10 7h4M10 17h4M10 7v10M14 7h6M14 17h6"/></svg>',
 sc:'<svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></svg>',rp:'<svg viewBox="0 0 24 24"><path d="M7 3h7l5 5v13H7zM14 3v5h5M10 13h6M10 17h6"/></svg>',
 ask:'<svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4zM8 9h8M8 12h5"/></svg>',al:'<svg viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0112 0v5l2 2H4zM10 21h4"/></svg>'};
const VIEWS=[['ov','Overview'],['tree','Value tree'],['sc','Scenarios'],['rp','Reports'],['ask','Ask'],['al','Alerts']];
function renderNav(){ const al=window.CONTENT.alerts(state).filter(a=>a.status==='open').length;
  $('#nav').innerHTML=VIEWS.map(([k,l])=>`<button class="${state.view===k?'on':''}" data-v="${k}">${ICONS[k]}<span class="lab">${l}</span>${k==='al'&&al?`<span class="badge">${al}</span>`:''}</button>`).join('');
  $('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>go(b.dataset.v)); }
function go(v,opts){ state.view=v; if(opts) Object.assign(state,opts); closeDrawer(); $('#modal').classList.remove('on');
  state.scNote=''; if((v==='rp'||v==='ask'||v==='al'||v==='ov')&&state.treeSc){ state.scNote=`The scenario “${state.presetName}” is set aside here: this page reads actual figures. It stays available on the Scenarios page.`; state.treeSc=null; } renderAll(); window.scrollTo(0,0); const h={ov:'overview',tree:'tree',sc:'scenarios',rp:'reports',ask:'ask',al:'alerts'}[v]; if(location.hash!=='#'+h) history.replaceState(null,'','#'+h); }
function opt(v,l,cur){ return `<option value="${esc(v)}" ${cur===v?'selected':''}>${esc(l)}</option>`; }

  if(v==='tree'){ const D=dimDef(); const allowed=state.persp==='op';
    if(allowed) html+=`<div class="sel"><label for="fCut">Portfolio cut</label><select id="fCut">${opt('','None',state.dim.k||'')}${C.DIMS.map(d=>opt(d.k,d.l,state.dim.k)).join('')}</select></div>${D?`<div class="sel"><label for="fMem">${esc(D.l)}</label><select id="fMem">${opt('','All',state.dim.m||'')}${D.members.map(m=>opt(m,m,state.dim.m)).join('')}</select></div>`:''}`;
    else html+=`<div class="sel" title="Portfolio splits are disclosed as shares of AUM. They are available in the Operating perspective."><label>Portfolio cut</label><span style="color:var(--mute);padding:0 6px">In Operating view</span></div>`; }
  $('#filters').innerHTML=html;
  $('#fPer').onchange=e=>{ state.p=e.target.value; if(state.treeSc&&state.p!=='Q2FY27') state.treeSc=null; renderAll(); };

  const fc=$('#fCut'); if(fc) fc.onchange=e=>{ state.dim= e.target.value? {k:e.target.value,m:null} : {k:null,m:null}; renderAll(); };
  const fm=$('#fMem'); if(fm) fm.onchange=e=>{ state.dim.m=e.target.value||null; renderAll(); }; }
function lensNote(){ if(!lensText()) return '';
  return `<div class="lens-note">Portfolio cut: <b>${esc(lensText())}</b>. Loan-book boxes show the disclosed share of AUM; earnings and funding boxes stay company level. One disclosed split at a time.<button id="clrLens">Clear cut</button></div>`; }

/* ---------- KPI strip ---------- */
function seriesFor(fn){ const qs=C.PERIODS.filter(p=>p.type==='q').map(p=>p.k).reverse(); return qs.map(k=>{ const S=vals(k); return S?fn(S):null; }); }
function spark(fn){ const P=P_BY[state.p]; if(P.type!=='q') return ''; const qs=C.PERIODS.filter(p=>p.type==='q').map(p=>p.k).reverse(); const idx=qs.indexOf(state.p);
  const pts=qs.slice(0,idx+1).map(k=>{ const S=vals(k); const v=S?fn(S):null; return v!=null&&isFinite(v)?v:null; }).filter(v=>v!=null);

  const d=pts.map((v,i)=>`${(i/(pts.length-1)*w).toFixed(1)},${(h-(v-mn)/r*h+2).toFixed(1)}`).join(' '); const last=d.split(' ').pop().split(',');

function renderKPIs(compact){ const S=curS(), Cm=cmpS();
  return `${compact?`<div class="kpi-basis">Company KPIs: ${esc(basisText())}</div>`:''}<div class="stats${compact?' compact':''}">${C.KPIS.map(([id,l,fn,u,dir,cap])=>{ const meta=nd(id); const a=nodeValue(meta,S); if(a.off) return `<div class="stat na"><div class="sl">${l}</div><div class="sv" style="font-size:15px">${esc(a.off)}</div><div class="sc">${esc(cap)}</div></div>`;
    const b=Cm?nodeValue(meta,Cm):{off:1}; const bv=b.off?null:b.v; const dl=delta(u,a.v,bv,dir); const x=fv(u,a.v);
    return `<button class="stat" data-node="${id}" title="${esc(cap)}"><div class="sl">${l}</div><div class="sv">${x.m}${x.s?`<small>${x.s}</small>`:''}</div><div class="sc">${esc(cmpLabel())} ${bv!=null?fv(u,bv).m:'–'} <span class="sd ${dl.cls}-t">${dl.txt.split(' ')[0]||''}</span></div><div class="spk">${lensText()?'':spark(fn)}</div></button>`; }).join('')}</div>`; }

/* ---------- tree layout & render (Horizon geometry) ---------- */
const W=196,H=106,CG=46,RG=14;
function kids(def,id,S){ return (def.ch[id]||[]).filter(([k])=>{ const m=C.N[k]; return !(m.only&&S&&!m.only(S)); }); }
function countDesc(def,id,S){ return kids(def,id,S).reduce((a,[k])=>a+1+countDesc(def,k,S),0); }
function layoutTree(key,S){ const def=C.TREES[key]; const nodes=[], edges=[], labels=[]; let y=0, maxD=0;
  function place(id,d,op,parent){ const ks=kids(def,id,S); const col=state.collapsed[key+':'+id]; const n={id,d,x:d*(W+CG),op,parent,kids:ks.length,collapsed:!!col};
    maxD=Math.max(maxD,d); nodes.push(n);
    if(ks.length&&!col){ let first=true; for(const [k,o] of ks){ const c=place(k,d+1,o,n); if(first){ n.y=c.y; first=false; } edges.push([n,c]); } }
    else { n.y=y; y+=H+RG; } return n; }
  def.roots.forEach(r=>{ if(r.label){ labels.push({y,text:r.label}); y+=24; } place(r.id,0,null,null); y+=18; });
  return {nodes,edges,labels,w:(maxD+1)*(W+CG)-CG+40,h:y}; }
function nodeHTML(key,n,S,Cm){ const meta=nd(n.id); const style=`left:${n.x}px;top:${n.y}px`;
  const a=nodeValue(meta,S); if(a.off) return `<div class="node off" style="${style}" title="${esc(a.off)}" data-node="${n.id}"><div class="n">${esc(meta.l)}</div><div class="val" style="font-size:12.5px;font-weight:500">${esc(a.off)}</div></div>`;
  const b=Cm?nodeValue(meta,Cm):{off:1}; const bv=b.off?null:b.v; const dl=delta(meta.u,a.v,bv,meta.dir); const x=fv(meta.u,a.v);
  const sel=state.sel===n.id?' picked':'';
  return `<button class="node ${dl.cls}${sel}" style="${style}" data-node="${n.id}" aria-label="${esc(meta.l)}"><div class="n">${esc(meta.l)}</div><div class="val">${x.m}${x.s?`<small>${x.s}</small>`:''}</div><div class="ft"><span>${esc(cmpLabel())} ${bv!=null?fv(meta.u,bv).m:'–'}</span>${dl.txt?`<span class="dchip ${dl.cls}">${dl.txt.split(' ')[0]}</span>`:''}</div></button>`; }
function treePanel(key){ const def=C.TREES[key]; const S=curS(), Cm=cmpS(); const L=layoutTree(key,S);
  let svg='', ops='', togs='';
  for(const [p,c] of L.edges){ const sx=p.x+W+CG/2, py=p.y+H/2, cy=c.y+H/2; const ap=def.approx&&def.approx[p.id], ex=def.explan&&def.explan[p.id];
    svg+=`<path d="M${p.x+W} ${py} H${sx} V${cy} H${c.x}" fill="none" stroke="var(--line)" stroke-width="1.4" ${ap?'stroke-dasharray="5 4"':ex?'stroke-dasharray="1.5 3.5"':''}/>`;
    if(c.op) ops+=`<div class="op" style="left:${sx-10}px;top:${cy-10}px" title="${ap?'Approximate driver':'Exact arithmetic'}">${c.op}</div>`; }
  for(const n of L.nodes){ if(n.kids){ const lab=n.collapsed? '+'+countDesc(def,n.id,S) : MINUS; togs+=`<button class="tog" data-tog="${key}:${n.id}" style="left:${n.x+W-11}px;top:${n.y+H/2+16}px" aria-label="${n.collapsed?'Expand':'Collapse'} ${esc(nd(n.id).l)}">${lab}</button>`; } }
  const labels=L.labels.map(l=>`<div class="col-label" style="left:0;top:${l.y}px">${esc(l.text)}</div>`).join('');
  const sub=`${P_BY[state.p].l}, against ${esc(cmpLabel())}${def.explan?'. Dotted lines: indicators, not formulas':''}${def.approx?'. Dashed lines: approximate drivers':''}`;
  return `<section class="panel${state.full===key?' full':''}" data-tree="${key}"><div class="panel-h"><h2>${esc(def.title)}</h2><span class="sub">${sub}</span><button class="btn fs" data-fs="${key}">${state.full===key?'Exit full screen':'Full screen'}</button></div>
   <div class="tree-wrap" id="tw-${key}"><div class="tree-inner" id="ti-${key}" style="width:${L.w}px;height:${L.h}px" data-w="${L.w}" data-h="${L.h}"><svg class="tree-svg" width="${L.w}" height="${L.h}">${svg}</svg>${labels}${L.nodes.map(n=>nodeHTML(key,n,S,Cm)).join('')}${ops}${togs}</div></div>
   <div class="zoom"><button data-z="expand">Expand all</button><button data-z="reset">Reset</button><i></i><button data-z="fit">Fit</button><button data-z="out" aria-label="Zoom out">${MINUS}</button><span id="zp-${key}">100%</span><button data-z="in" aria-label="Zoom in">+</button></div></section>`; }
function applyZoom(key){ const inner=$('#ti-'+key), wrap=$('#tw-'+key); if(!inner||!wrap) return;
  const w=+inner.dataset.w, h=+inner.dataset.h; let z=state.zoom[key];
  if(z==null||z==='fit'){ const avail=wrap.clientWidth-40; const full=state.full===key; z=full? Math.max(.5,Math.min(1.15,avail/w)) : Math.max(.85,Math.min(1,avail/w)); }
  inner.style.transform=`scale(${z})`; inner.style.width=w+'px'; inner.style.height=h+'px';
  inner.parentElement.style.height= state.full===key? '' : (h*z+90)+'px'; inner.style.marginRight=(-(w*(1-z)))+'px'; inner.style.marginBottom=(-(h*(1-z)))+'px';
  const zp=$('#zp-'+key); if(zp) zp.textContent=Math.round(z*100)+'%'; wrap.dataset.z=z; }
function bindTree(root){ root.querySelectorAll('[data-node]').forEach(el=>el.onclick=()=>openNode(el.dataset.node));
  root.querySelectorAll('[data-tog]').forEach(el=>el.onclick=e=>{ e.stopPropagation(); const id=el.dataset.tog; state.collapsed[id]=!state.collapsed[id]; state.focus=id; renderPage(); });

    if(a==='fit') state.zoom[key]='fit'; else if(a==='in') state.zoom[key]=Math.min(1.4,cz+.1); else if(a==='out') state.zoom[key]=Math.max(.3,cz-.1);

    applyZoom(key); }); }); }

/* ---------- drawer ---------- */
function trendSVG(meta){ const qs=C.PERIODS.filter(p=>p.type==='q').map(p=>p.k).reverse(); const pts=qs.map(k=>{ const S=vals(k); const r=S?nodeValue(meta,S):{off:1}; return r.off?null:r.v; });
  const all=pts.filter(v=>v!=null); if(all.length<2) return '<div style="color:var(--mute)">Fewer than two quarters disclosed.</div>';
  const mn=Math.min(...all), mx=Math.max(...all), r=(mx-mn)||1, w=420, h=120, n=pts.length;
  const P=pts.map((v,i)=>v==null?null:`${(i/(n-1)*(w-20)+10).toFixed(1)},${(h-14-(v-mn)/r*(h-34)).toFixed(1)}`).filter(Boolean).join(' ');
  const labs=[0,n-1].map((i,j)=>`<text x="${j?w-10:10}" y="${h}" font-size="11" fill="var(--mute)" text-anchor="${j?'end':'start'}">${P_BY[qs[i]].l}</text>`).join('');
  return `<svg viewBox="0 0 ${w} ${h+4}" style="width:100%;height:auto"><polyline points="${P}" fill="none" stroke="var(--accent)" stroke-width="2.2"/>${labs}</svg>`; }
function openNode(id){ state.sel=id; const meta=nd(id); const S=curS(), Cm=cmpS(); const a=nodeValue(meta,S);
  const scChanged=state.treeSc&&Cm&&!a.off&&(()=>{ const b=nodeValue(meta,Cm); return !b.off&&Math.abs(b.v-a.v)>1e-6; })();
  const layerTxt=state.treeSc? (scChanged?'Scenario: calculated with stated assumptions':'Actual, calculated basis (unchanged in this scenario)') : (meta.layer||'Public disclosure');
  const tags=[`<span class="tag rev">${esc(layerTxt)}</span>`]; if(lensText()) tags.push(`<span class="tag">${esc(lensText())}</span>`); if(state.treeSc) tags.push(`<span class="tag">Scenario: ${esc(state.presetName)}</span>`);
  $('#dTitle').innerHTML=`<h3>${esc(meta.l)}</h3><div class="tags">${tags.join('')}</div>`;
  let h='';
  if(a.off){ h+=`<p class="read">${esc(a.off)}.</p>`; }
  else { const b=Cm?nodeValue(meta,Cm):{off:1}; const bv=b.off?null:b.v; const dl=delta(meta.u,a.v,bv,meta.dir);
    h+=`<div class="bigv">${fvs(meta.u,a.v)}</div><div style="color:var(--mute);margin:2px 0 4px">${esc(cmpLabel())} ${bv!=null?fvs(meta.u,bv):'not available'} ${dl.txt?dl.txt.split(' ').map(x=>`<span class="dchip ${dl.cls}" style="margin-left:6px">${x}</span>`).join(''):''}</div>`;
    h+=`<div class="read" style="margin-top:12px">${window.CONTENT.readFor(id,meta,S,Cm,state)}</div>`; }
  h+=`<dl class="dl" style="margin-top:16px"><dt>Formula</dt><dd>${esc(meta.f)}</dd><dt>Proposed owner</dt><dd>${esc(meta.o)}</dd><dt>Source</dt><dd>${linkSrc(meta.s)}</dd><dt>Basis</dt><dd>${esc(state.treeSc?'Quarterly amounts recalculated from the adjusted P&L; ratios calculated from the same average balances':(P_BY[state.p].type==='q'?'Quarterly amounts; ratios as published':'Period totals; ratios as published'))}</dd></dl>`;
  h+=`<div class="h4">By quarter</div>${trendSVG(meta)}`;
  if(meta.grain==='portfolio' && !state.dim.m){ const D=C.DIMS[0]; const rows=D.members.map(m=>{ const sh=D.share(m,S.endKey); return sh==null?null:[m,meta.v(S)*sh/100,sh]; }).filter(Boolean);
    if(rows.length) h+=`<div class="h4">By state, disclosed share of AUM</div><div class="tw"><table class="t"><thead><tr><th>State</th><th>₹ Cr</th><th>Share</th></tr></thead><tbody>${rows.map(r=>`<tr class="click" data-lk="${esc(r[0])}"><td>${esc(r[0])}</td><td>${num(r[1],0)}</td><td>${num(r[2],1)}%</td></tr>`).join('')}</tbody></table></div><div style="color:var(--mute);font-size:12.5px;margin-top:6px">Click a row to filter the tree. State P&amp;L is not disclosed.</div>`; }
  $('#dBody').innerHTML=h; $('#drawer').classList.add('open'); $('#scrim').classList.add('on');
  $('#dBody').querySelectorAll('[data-lk]').forEach(tr=>tr.onclick=()=>{ state.dim={k:'state',m:tr.dataset.lk}; closeDrawer(); go('tree'); });
  document.querySelectorAll('.node.picked').forEach(n=>n.classList.remove('picked')); document.querySelectorAll(`.node[data-node="${id}"]`).forEach(n=>n.classList.add('picked')); }
function openPanel(title,body,bind){ state.sel=null; $('#dTitle').innerHTML=title; $('#dBody').innerHTML=body; $('#drawer').classList.add('open'); $('#scrim').classList.add('on'); if(bind) bind($('#dBody')); }
function closeDrawer(){ $('#drawer').classList.remove('open'); $('#scrim').classList.remove('on'); state.sel=null; document.querySelectorAll('.node.picked').forEach(n=>n.classList.remove('picked')); }

/* ---------- modal ---------- */
function modal(html){ $('#sheet').innerHTML=`<button class="x" id="mClose" aria-label="Close">×</button>`+html; $('#modal').classList.add('on'); $('#mClose').onclick=()=>$('#modal').classList.remove('on');
  $('#sheet').querySelectorAll('[data-on]').forEach(c=>c.onclick=()=>{ $('#modal').classList.remove('on'); openNode(c.dataset.on); }); }
function tableHTML(head,rows,total){ return `<div class="tw"><table class="t"><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}${total?`<tr class="total">${total.map(c=>`<td>${c}</td>`).join('')}</tr>`:''}</tbody></table></div>`; }

/* ---------- views ---------- */
function viewTree(){ const Pz=C.PERSPECTIVES[state.persp];
  const st=window.CONTENT.story(state,curS(),cmpS());
  let h=`<h2 class="headline">${st.h}</h2>${st.k?`<p class="takeaway">${st.k}</p>`:''}`+lensNote();
  if(state.treeSc) h+=`<div class="lens-note" style="background:var(--accent-soft)">Illustrative scenario: <b>${esc(state.presetName)}</b>, compared with actual Q2 FY27 on the same calculated basis. Every box, including the Board ratios, is recalculated from the adjusted P&amp;L and the same average balances. Actuals are unchanged. <button id="clrSc">Back to actuals</button></div>`;
  if(state.cmp==='plan'&&!state.treeSc) h+=`<div class="lens-note" style="background:var(--amber-soft)">Comparison: <b>Plan (illustrative)</b>. Synthetic plan figures set for the demonstration; HomeFirst’s own plan would replace them.</div>`;
  if(state.persp==='demo') h+=window.CONTENT.demoBanner(state,API)+(state.demoNote?`<div class="lens-note">${esc(state.demoNote)}</div>`:'');
  h+=renderKPIs(true);
  h+=`<div class="tabrow"><div class="tabs">${Object.entries(C.PERSPECTIVES).map(([k,t])=>`<button data-tab="${k}" class="${state.persp===k?'on':''}" title="${esc(t.d)}">${t.l}</button>`).join('')}</div><div class="legend"><span><i style="background:var(--good)"></i>Better</span><span><i style="background:var(--bad)"></i>Worse</span></div></div>`;
  if(state.persp==='op'&&state.dim.k) h+=window.CONTENT.portfolioPanel(state,API);
  if(state.persp==='demo'&&!curS().d&&!state.treeSc) h+=`<div class="box">The illustrative layer covers Q1 and Q2 FY27. Choose one of those quarters.</div>`;
  else if(state.persp==='demo'&&state.treeSc) h+=`<div class="box">Scenarios run on public company figures; the illustrative layer shows actual-quarter detail. <button class="linkb" id="clrSc2">Back to actuals</button></div>`;
  else h+=`<div class="panels">${Pz.trees.map(treePanel).join('')}</div>`;
  h+=window.CONTENT.treeLower(state,curS(),cmpS());
  return h; }
function bindTreeView(){ const p=$('#page'); bindTree(p);
  p.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{ state.persp=b.dataset.tab; if(state.persp!=='op') state.dim={k:null,m:null}; if(state.persp==='demo') demoCmp(); renderAll(); });
  const cl=$('#clrLens'); if(cl) cl.onclick=()=>{ state.dim={k:null,m:null}; renderAll(); };
  const cs=$('#clrSc'); if(cs) cs.onclick=()=>{ state.treeSc=null; renderAll(); };
  const cs2=$('#clrSc2'); if(cs2) cs2.onclick=()=>{ state.treeSc=null; renderAll(); };
  window.CONTENT.bindLower(p,state,API);
  C.PERSPECTIVES[state.persp].trees.forEach(applyZoom);
  if(state.focus){ const [key,id]=state.focus.split(':'); state.focus=null; const wrap=$('#tw-'+key); const el=wrap&&wrap.querySelector(`.node[data-node="${id}"]`); if(wrap&&el){ const z=+wrap.dataset.z||1; const x=el.offsetLeft*z, y=el.offsetTop*z; wrap.scrollLeft=Math.max(0,x-wrap.clientWidth*0.3); const r=wrap.getBoundingClientRect(); window.scrollTo({top:window.scrollY+r.top+y-160,behavior:'smooth'}); } } }

function demoCmp(){ const k=cmpKey(); const S=k?vals(k):null; state.demoNote=''; if(!S||!S.d){ const P=P_BY[state.p]; const alt=P.plan?'plan':(P.lp&&vals(P.lp)&&vals(P.lp).d?'lp':null); if(alt){ state.demoNote=`Comparison set to ${P_BY[P[alt]].l}: ${k?P_BY[k].l:'the other comparison'} has no operating detail.`; state.cmp=alt; } else if(vals(state.p)&&vals(state.p).d){ state.demoNote=`No comparison with operating detail is available for ${P_BY[state.p].l}; changes shown are against public company figures only.`; } } }
function renderPage(){ const p=$('#page'); const v=state.view; const CT=window.CONTENT;
  const note=state.scNote&&(v==='rp'||v==='ask'||v==='al'||v==='ov')?`<div class="lens-note">${esc(state.scNote)}</div>`:'';
  if(v==='ov'){ p.innerHTML=note+CT.viewOv(state,API); CT.bindOv(p,state,API); }
  else if(v==='tree'){ p.innerHTML=viewTree(); bindTreeView(); }
  else if(v==='sc'){ p.innerHTML=CT.viewSc(state,API); CT.bindSc(p,state,API); }
  else if(v==='rp'){ p.innerHTML=note+CT.viewRp(state,API); CT.bindRp(p,state,API); }
  else if(v==='ask'){ p.innerHTML=note+CT.viewAsk(state,API); CT.bindAsk(p,state,API); }
  else if(v==='al'){ p.innerHTML=note+CT.viewAl(state,API); CT.bindAl(p,state,API); }
  p.querySelectorAll('[data-on]').forEach(c=>{ if(!c.onclick) c.onclick=()=>openNode(c.dataset.on); }); }
function renderAll(){ if(state.view==='tree'&&state.persp==='demo') demoCmp(); renderNav(); renderFilters(); renderPage(); renderRoute(); }

/* ---------- guided meeting route ---------- */
const ROUTE=[['Overview: what changed',()=>go('ov')],['Business tree: which lines explain it',()=>go('tree',{persp:'biz',treeSc:null})],['Operating view: capacity and credit',()=>go('tree',{persp:'op',treeSc:null})],['Growth capacity: staffing sensitivity',()=>go('sc',{scKind:'cap'})],['Board view: returns and capital',()=>go('tree',{persp:'board'})],['Branch and channel (illustrative): a cluster alert',()=>{ state.alertSel='A7'; go('tree',{persp:'demo',treeSc:null}); }]];
function routeIdx(){ const v=state.view; if(v==='ov') return 0; if(v==='tree') return state.persp==='biz'?1:state.persp==='op'?2:state.persp==='board'?4:state.persp==='demo'?5:-1; if(v==='sc') return 3; return -1; }
function renderRoute(){ const el=$('#route'); if(!el) return; el.hidden=!state.presenter; const pb=$('#presBtn'); if(pb) pb.textContent=state.presenter?'Hide presenter route':'Presenter mode'; state.route=routeIdx(); el.innerHTML=`<b>Meeting route</b>${ROUTE.map(([l],i)=>`<button data-rt="${i}" class="${state.route===i?'on':''}">${i+1}. ${esc(l)}</button>`).join('')}`;
  el.querySelectorAll('[data-rt]').forEach(b=>b.onclick=()=>{ ROUTE[+b.dataset.rt][1](); });
  if(state.treeSc&&state.presenter) el.insertAdjacentHTML('beforeend',`<span style="color:var(--side-mute);font-size:12px;margin-top:4px">Scenario active: the Board step keeps it.</span>`); }

/* ---------- shell events and routing ---------- */
$('#dClose').onclick=closeDrawer; $('#scrim').onclick=closeDrawer;
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closeDrawer(); $('#modal').classList.remove('on'); } });
$('#modal').onclick=e=>{ if(e.target.id==='modal') $('#modal').classList.remove('on'); };
$('#resetBtn').onclick=()=>{ state.p='Q2FY27'; state.cmp='ly'; state.dim={k:null,m:null}; state.treeSc=null; state.sc=JSON.parse(JSON.stringify(DEF_SC)); state.preset=null; state.convo=[]; state.persp='biz'; go('ov'); };
$('#methodBtn').onclick=()=>modal(window.CONTENT.method(API));
{ const mode=window.DELIVERY==='claude'?'claude':'portable'; const L=C.PRESENTATION&&C.PRESENTATION[mode]; const a=$('#presLink'), b=$('#assessLink'); if(L){ if(a) a.href=L.discussion; if(b) b.href=L.assessment; } }
{ const pb=$('#presBtn'); if(pb) pb.onclick=()=>{ state.presenter=!state.presenter; renderRoute(); }; }
function fromHash(){ const h=(location.hash||'').slice(1);
  if(h==='presenter'){ state.presenter=true; return; }
  const map={capacity:['sc',{scKind:'cap'}],illustrative:['tree',{persp:'demo'}],overview:['ov'],tree:['tree',{persp:'biz'}],scenarios:['sc'],insurance:['sc',{scKind:'ins'}],funding:['sc',{scKind:'fun'}],reports:['rp'],ask:['ask'],alerts:['al'],board:['tree',{persp:'board'}],operating:['tree',{persp:'op'}],bridge:['tree',{persp:'board',openBridge:true}]};
  const m=map[h]; if(m){ state.view=m[0]; if(m[1]) Object.assign(state,m[1]); } }
const API={basisText,openPanel,renderKPIs,C,state,vals,curS,cmpS,cmpLabel,cmpKey,P_BY,nd,num,rs,fv,fvs,delta,esc,go,openNode,modal,tableHTML,renderAll,renderPage,linkSrc,docUrl,nodeValue,MINUS,DEF_SC};
window.PLATFORM=API;
fromHash(); renderAll();
if(state.openBridge){ state.openBridge=false; window.CONTENT.openBridge(API); }
window.addEventListener('hashchange',()=>{ $('#modal').classList.remove('on'); closeDrawer(); fromHash(); renderAll(); if(state.openBridge){ state.openBridge=false; window.CONTENT.openBridge(API); } });
})();

</script>
</body>
